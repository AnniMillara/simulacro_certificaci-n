{% extends "base.html" %}
{% block title %}{{ 'Editar' if entidad else 'Nuevo' }}{% endblock %}

{% block content %}
<div class="page-header">
    <h2>{{ 'Editar' if entidad else 'Nuevo' }} registro</h2>
</div>

<div class="card-bookhub form-narrow">
    <form action="{{ url_for('modificar_entidad', id=entidad.id_entidad) if entidad else url_for('crear_entidad') }}" method="POST">

        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" name="nombre" class="form-control"
                   value="{{ entidad.nombre if entidad else '' }}" required>
        </div>

        <div class="mb-3">
            <label>Categoría</label>
            <select name="categoria_id" class="form-select" required>
                <option value="">-- Selecciona --</option>
                {% for c in categorias %}
                <option value="{{ c.id_categoria }}"
                        {% if entidad and entidad.categoria_id == c.id_categoria %}selected{% endif %}>
                    {{ c.nombre }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- ↓↓↓ CAMPOS ESPECÍFICOS (ajustar por escenario) ↓↓↓ -->
        <div class="mb-3">
            <label>Fecha</label>
            <input type="date" name="fecha" class="form-control"
                   value="{{ entidad.fecha.strftime('%Y-%m-%d') if entidad and entidad.fecha else '' }}">
        </div>

        <div class="mb-3">
            <label>Precio</label>
            <input type="number" step="0.01" name="precio" class="form-control"
                   value="{{ entidad.precio if entidad and entidad.precio else '' }}">
        </div>

        <div class="mb-3">
            <label>Stock</label>
            <input type="number" name="stock" class="form-control"
                   value="{{ entidad.stock if entidad and entidad.stock else '' }}">
        </div>
        <!-- ↑↑↑ ↑↑↑ -->

        <div class="mb-3">
            <label>Descripción</label>
            <textarea name="descripcion" class="form-control" rows="4" required>{{ entidad.descripcion if entidad else '' }}</textarea>
        </div>

        <button type="submit" class="btn btn-dark">{{ 'Actualizar' if entidad else 'Guardar' }}</button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
