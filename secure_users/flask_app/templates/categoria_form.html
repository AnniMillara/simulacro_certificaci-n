{% extends "base.html" %}
{% block title %}{{ 'Editar' if categoria else 'Nueva' }} Categoría{% endblock %}

{% block content %}
<div class="page-header">
    <h2>{{ 'Editar' if categoria else 'Nueva' }} Categoría</h2>
</div>

<div class="card-bookhub form-narrow">
    <form action="{{ url_for('modificar_categoria', id=categoria.id_categoria) if categoria else url_for('crear_categoria') }}" method="POST">
        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" name="nombre" class="form-control"
                   value="{{ categoria.nombre if categoria else '' }}" required>
        </div>
        <div class="mb-3">
            <label>Descripción</label>
            <textarea name="descripcion" class="form-control" rows="3" required>{{ categoria.descripcion if categoria else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-dark">{{ 'Actualizar' if categoria else 'Guardar' }}</button>
        <a href="{{ url_for('lista_categorias') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
